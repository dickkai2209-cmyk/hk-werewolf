*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;background:#05060c;color:var(--cream);font-family:var(--sans);}
body{min-height:100dvh;overflow:hidden;}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;padding:0;}
img{max-width:100%;display:block;}
.stage{min-height:100dvh;height:100dvh;display:flex;justify-content:center;align-items:center;background:
  radial-gradient(ellipse at 50% 30%,#14182a 0%,#05060c 62%,#030308 100%);}
.phone{
  width:min(100vw, calc(100dvh * 9 / 16), 430px);
  aspect-ratio:9/16;height:auto;max-height:100dvh;min-height:0;
  position:relative;overflow:hidden;background:#070b18;
  container-type:inline-size;container-name:phone;
  box-shadow:0 0 0 1px rgba(212,175,55,.12),0 24px 80px rgba(0,0,0,.65);
}
.bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    linear-gradient(180deg,rgba(5,6,12,.42) 0%,rgba(5,6,12,.62) 45%,rgba(5,6,12,.86) 100%),
    var(--scenic-bg) left 20% top / cover no-repeat,
    #070b18;}
.bg svg{width:100%;height:100%;display:none;}
.phone.exact-home .bg{display:none;}
.phone.exact-home .app-layer{background:#05060c;}
.spark{animation:twinkle 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
.spark2{animation:twinkle 4.8s ease-in-out infinite .8s;}
.spark3{animation:twinkle 5.4s ease-in-out infinite 1.6s;}
.moon-glow{animation:moonPulse 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes moonPulse{0%,100%{opacity:.55}50%{opacity:.9}}
@keyframes waterShimmer{0%,100%{opacity:.35}50%{opacity:.85}}
.wsh{animation:waterShimmer 2.8s ease-in-out infinite;}
.wsh2{animation:waterShimmer 3.6s ease-in-out infinite 1s;}
.wsh3{animation:waterShimmer 4.2s ease-in-out infinite 1.8s;}

.app-layer{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;min-height:0;}
.topbar{
  position:relative;z-index:6;flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px 6px;min-height:var(--top-h);
}
.judge-btn{
  display:flex;align-items:center;gap:8px;min-height:44px;min-width:44px;
  padding:0 8px 0 0;color:var(--gold-l);
}
.judge-frame{
  width:48px;height:48px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#3a2a1c,#1a120c 70%);
  box-shadow:0 0 0 1.5px #d4af37,0 0 0 3px #5a4318,0 0 0 4.5px #c9a227,0 0 14px rgba(212,175,55,.45);
  overflow:hidden;flex:0 0 48px;position:relative;
}
.judge-frame svg,.judge-frame img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block;}
.judge-name{font-family:var(--serif);font-size:15px;letter-spacing:.06em;color:#f0e0b0;text-shadow:0 1px 4px #000;}
.caps{display:flex;align-items:center;gap:6px;}
.cap{
  display:flex;align-items:center;gap:4px;
  min-height:28px;padding:2px 8px 2px 4px;
  border:1px solid rgba(212,175,55,.7);
  border-radius:999px;background:rgba(8,10,20,.72);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),0 0 8px rgba(212,175,55,.12);
  min-width:44px;color:var(--gold-l);font-size:11px;letter-spacing:.04em;
}
.cap .cap-ico{width:20px;height:20px;flex:0 0 20px;}
.cap .cap-lab{font-size:10px;color:#e8d9a8;white-space:nowrap;}
.cap .cap-n{font-variant-numeric:tabular-nums;color:#f6e8c8;font-size:10px;opacity:.9;}

.scroll{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:0 0 8px;
}
.scroll::-webkit-scrollbar{width:0;height:0;}

.hero{
  margin:4px 16px 10px;
  position:relative;
  min-height:76px;
  padding:12px 14px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(80,50,110,.35),transparent 70%),
    linear-gradient(180deg,rgba(28,18,48,.88),rgba(12,10,28,.9));
  border-radius:4px;
}
.hero-frame{
  position:absolute;inset:0;pointer-events:none;
  border:1.5px solid #d4af37;
  border-radius:4px;
  box-shadow:inset 0 0 0 1px rgba(80,60,20,.6),0 0 16px rgba(212,175,55,.18),0 8px 18px rgba(0,0,0,.35);
}
.hero-frame .c{position:absolute;width:18px;height:18px;border:1.5px solid #e6c65a;}
.hero-frame .c.tl{top:-1px;left:-1px;border-right:0;border-bottom:0;}
.hero-frame .c.tr{top:-1px;right:-1px;border-left:0;border-bottom:0;}
.hero-frame .c.bl{bottom:-1px;left:-1px;border-right:0;border-top:0;}
.hero-frame .c.br{bottom:-1px;right:-1px;border-left:0;border-top:0;}
.hero-frame .orn{position:absolute;width:28px;height:10px;opacity:.9;}
.hero-titles{position:relative;z-index:1;flex:1;min-width:0;text-align:center;padding:2px 4px 0 8px;}
.hero h1{
  margin:0;font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.15;letter-spacing:.12em;
  background:linear-gradient(180deg,#fff6d0 0%,#f0d78c 28%,#D4AF37 58%,#9a7420 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.7));
}
.hero .sub{margin:2px 0 0;font-size:12px;letter-spacing:.16em;color:#e8d5a0;text-shadow:0 1px 3px #000;}
.btn-view{
  position:relative;z-index:1;flex:0 0 auto;
  min-width:52px;min-height:44px;padding:6px 12px;
  border:1px solid #d4af37;border-radius:4px;
  background:linear-gradient(180deg,rgba(50,36,18,.7),rgba(20,14,8,.8));
  color:#f3e0a0;font-size:13px;letter-spacing:.12em;
  box-shadow:0 0 8px rgba(212,175,55,.2),inset 0 1px 0 rgba(255,230,150,.2);
}

.mode-col{display:flex;flex-direction:column;align-items:flex-end;gap:10px;padding:8px 14px 8px 40px;}
.mode-card{
  width:min(236px,68%);
  min-height:74px;
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 6px 8px 14px;
  border-radius:8px;
  background:linear-gradient(90deg,rgba(10,12,24,.82),rgba(16,14,30,.7));
  border:1px solid rgba(212,175,55,.75);
  box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 0 0 1px rgba(0,0,0,.4);
  position:relative;overflow:visible;text-align:left;
  min-width:44px;
}
.mode-card .mt{flex:1;min-width:0;z-index:1;}
.mode-card .mt b{display:block;font-size:18px;font-weight:700;color:#f6edd4;letter-spacing:.1em;text-shadow:0 2px 6px #000;}
.mode-card .mt span{display:block;margin-top:3px;font-size:11px;letter-spacing:.14em;color:#d8c88a;}
.mode-card .mav{
  width:86px;height:86px;margin:-14px 0 -14px 0;flex:0 0 86px;
  position:relative;z-index:2;filter:drop-shadow(0 4px 8px rgba(0,0,0,.55));
}
.mode-card .mav svg,.mode-card .mav img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;}
.mode-card .mav img{border-radius:10px 10px 34% 34%;}

.core-btns{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;
  padding:18px 22px 10px;
  margin-top:auto;
}
.core-btn{
  min-height:86px;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:linear-gradient(180deg,rgba(18,16,30,.82),rgba(8,8,18,.88));
  border:1.5px solid #d4af37;
  box-shadow:0 8px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,220,140,.15),0 0 16px rgba(212,175,55,.12);
  color:#f6e8c8;
}
.core-btn .ico{width:28px;height:28px;margin-bottom:2px;}
.core-btn b{font-size:18px;letter-spacing:.28em;font-weight:700;text-indent:.28em;}
.core-btn em{font-style:normal;font-size:11px;letter-spacing:.16em;color:#d8c88a;margin-top:2px;}
.core-btn.join{border-color:#c5c0c8;box-shadow:0 8px 18px rgba(0,0,0,.45),inset 0 0 0 1px rgba(90,20,30,.35),0 0 12px rgba(120,30,40,.18);}

.board-more{padding:6px 22px 16px;text-align:center;}
.linkish{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:44px;padding:0 14px;color:#e6d19a;letter-spacing:.12em;font-size:13px;
  text-decoration:none;border-bottom:1px solid rgba(212,175,55,.35);
}

.nav{
  position:absolute;left:0;right:0;bottom:0;z-index:12;
  height:calc(var(--nav-h) + var(--safe-b));
  padding:4px 6px calc(8px + var(--safe-b));
  display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  background:linear-gradient(180deg,rgba(6,8,16,.0),rgba(6,8,16,.82) 28%,rgba(6,8,14,.96));
  border-top:1px solid rgba(212,175,55,.16);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:44px;color:#d7c9a0;gap:1px;padding:4px 0 0;
}
.nav-item .ni{
  width:44px;height:36px;display:flex;align-items:center;justify-content:center;
  border-radius:10px;
}
.nav-item svg{width:26px;height:26px;display:block;}
.nav-item .nl{font-size:11px;letter-spacing:.08em;line-height:1.15;text-align:center;}
.nav-item .ns{font-size:9px;opacity:.8;letter-spacing:.06em;}
.nav-item.active{color:#f3e0a0;}
.nav-item.active .ni{
  background:rgba(30,24,12,.7);
  box-shadow:0 0 0 1px rgba(212,175,55,.85),0 0 14px rgba(212,175,55,.45),inset 0 0 8px rgba(212,175,55,.15);
}
.nav-item.active svg{filter:drop-shadow(0 0 4px rgba(212,175,55,.8));}


.home-exact{
  position:absolute;inset:0;z-index:2;
  background:#1a1a32;
  overflow:hidden;
}
.home-exact .home-scene{
  position:absolute;inset:0;width:100%;height:100%;
  max-width:none;display:block;object-fit:fill;object-position:center;
  pointer-events:none;user-select:none;
}
.home-play-wrap{
  position:absolute;left:8px;right:8px;top:8px;z-index:6;pointer-events:none;
}

function campOf(roleId) {
  var r = findRole(roleId);
  return r ? r.camp : "villager";
}
function findRole(id) {
  for (var i = 0; i < ROLES_CONFIG.length; i++) if (ROLES_CONFIG[i].id === id) return ROLES_CONFIG[i];
  return null;
}
function getBoardRoleTotal(board) {
  if (!board || !board.roles) return 0;
  var n = 0;
  for (var k in board.roles) if (Object.prototype.hasOwnProperty.call(board.roles, k)) n += Number(board.roles[k]) || 0;
  return n;
}
function expandBoardRoles(board) {
  var list = [];
  var roles = (board && board.roles) || {};
  for (var k in roles) {
    if (!Object.prototype.hasOwnProperty.call(roles, k)) continue;
    var c = Number(roles[k]) || 0;
    for (var i = 0; i < c; i++) list.push(k);
  }
  return list;
}

function generateRoomCode(existing) {
  existing = existing || [];
  var used = {};
  for (var i = 0; i < existing.length; i++) used[String(existing[i])] = true;
  for (var t = 0; t < 200; t++) {
    var n = 1000 + Math.floor(Math.random() * 9000);
    var code = String(n);
    if (!used[code]) return code;
  }
  return String(1000 + (Date.now() % 9000));
}

function consumePotion(potions, type) {
  potions = potions ? { antidote: !!potions.antidote, poison: !!potions.poison } : { antidote: false, poison: false };
  if (type !== "antidote" && type !== "poison") return { ok: false, reason: "unknown-potion", potions: potions };
  if (!potions[type]) return { ok: false, reason: "already-used", potions: potions };
  var next = { antidote: potions.antidote, poison: potions.poison };
  next[type] = false;
  return { ok: true, potions: next };
}

/**
 * 夜晚結算
 * 同守同救奶穿：守衛守護 + 女巫解藥同時作用於同一人時，該人死亡。
 * 獵人開槍：中毒不可開；被刀（含奶穿）可開。刀+毒則不可開。
 */
function resolveNight(input) {
  input = input || {};
  var seats = input.seats || [];
  var wolfKill = numOrNull(input.wolfKill);
  var guardTarget = numOrNull(input.guardTarget);
  var witchSave = !!input.witchSave;
  var witchSaveTarget = numOrNull(input.witchSaveTarget);
  if (witchSave && witchSaveTarget == null) witchSaveTarget = wolfKill;
  var witchPoison = numOrNull(input.witchPoison);
  var potions = input.witchPotions || { antidote: true, poison: true };
  potions = { antidote: !!potions.antidote, poison: !!potions.poison };
  var nightNumber = Number(input.nightNumber) || 1;
  var firstNightSelfSave = input.firstNightSelfSave !== false;
  var lastGuardTarget = numOrNull(input.lastGuardTarget);
  var onePotionPerNight = input.onePotionPerNight !== false;
  var noConsecutiveGuard = input.noConsecutiveGuard !== false;
  var invalid = [];

  if (noConsecutiveGuard && guardTarget != null && lastGuardTarget != null && guardTarget === lastGuardTarget) {
    invalid.push("consecutive-guard");
    guardTarget = null;
  }

  if (witchSave && witchPoison && onePotionPerNight) {
    invalid.push("one-potion-per-night");
    witchPoison = null;
  }

  var saveUsed = false, poisonUsed = false;

  if (witchSave) {
    if (!potions.antidote) {
      invalid.push("antidote-already-used");
      witchSave = false;
      witchSaveTarget = null;
    } else {
      var witchSeat = numOrNull(input.witchSeat);
      if (witchSeat == null) witchSeat = findSeatByRole(seats, "witch");
      if (witchSaveTarget != null && witchSeat != null && witchSaveTarget === witchSeat) {
        if (!(nightNumber === 1 && firstNightSelfSave)) {
          invalid.push("self-save-forbidden");
          witchSave = false;
          witchSaveTarget = null;
        }
      }
      if (witchSave && witchSaveTarget == null) {
        invalid.push("no-save-target");
        witchSave = false;
      }
    }
  }
  if (witchPoison) {
    if (!potions.poison) {
      invalid.push("poison-already-used");
      witchPoison = null;
    }
  }

  if (witchSave) { var c1 = consumePotion(potions, "antidote"); potions = c1.potions; saveUsed = c1.ok; }
  if (witchPoison) { var c2 = consumePotion(potions, "poison"); potions = c2.potions; poisonUsed = c2.ok; if (!c2.ok) witchPoison = null; }

  var deathMap = {};
  function addDeath(seat, cause) {
    if (seat == null) return;
    if (!deathMap[seat]) deathMap[seat] = { seat: seat, causes: [] };
    if (deathMap[seat].causes.indexOf(cause) < 0) deathMap[seat].causes.push(cause);
  }

  if (wolfKill != null) {
    var isGuarded = guardTarget != null && guardTarget === wolfKill;
    var isSaved = witchSave && witchSaveTarget != null && witchSaveTarget === wolfKill;
    if (isGuarded && isSaved) {
      addDeath(wolfKill, "knife");
      addDeath(wolfKill, "naiChuan");
    } else if (isGuarded || isSaved) {
      /* 存活：單守或單救成功 */
    } else {
      addDeath(wolfKill, "knife");
    }
  }

  if (witchPoison != null && poisonUsed) addDeath(witchPoison, "poison");

  var deaths = [];
  for (var k in deathMap) {
    if (!Object.prototype.hasOwnProperty.call(deathMap, k)) continue;
    var d = deathMap[k];
    var hunterCanShoot = d.causes.indexOf("poison") < 0 && (d.causes.indexOf("knife") >= 0 || d.causes.indexOf("naiChuan") >= 0);
    /* 純粹中毒：不可開槍；被刀／奶穿：可開；刀+毒：不可開 */
    if (d.causes.indexOf("poison") >= 0 && d.causes.indexOf("knife") < 0 && d.causes.indexOf("naiChuan") < 0) {
      hunterCanShoot = false;
    }
    d.hunterCanShoot = hunterCanShoot;
    deaths.push(d);
  }
  deaths.sort(function (a, b) { return a.seat - b.seat; });

  var dawnSpeech = buildDawnSpeech(deaths);
  return {
    deaths: deaths,
    witchPotions: potions,
    dawnSpeech: dawnSpeech,
    invalid: invalid,
    resolved: {
      wolfKill: wolfKill,
      guardTarget: guardTarget,
      witchSave: !!witchSave,
      witchSaveTarget: witchSave ? witchSaveTarget : null,
      witchPoison: witchPoison,
      saveUsed: saveUsed,
      poisonUsed: poisonUsed
    }
  };
}

function buildDawnSpeech(deaths) {
  if (!deaths || !deaths.length) return "天亮請睜眼。昨晚係平安夜。";
  var nos = deaths.map(function (d) { return d.seat + "號"; }).join("、");
  var extra = "";
  var nai = deaths.filter(function (d) { return d.causes.indexOf("naiChuan") >= 0; });
  if (nai.length) extra += "（其中 " + nai.map(function (d) { return d.seat + "號"; }).join("、") + " 因同守同救奶穿而死亡。）";
  return "天亮請睜眼。昨晚死亡嘅係 " + nos + "。" + extra;
}

function hunterShootStatus(roleId, deathEntry) {
  if (!deathEntry) return { canShoot: false, reason: "未死亡" };
  var shootRoles = { hunter: true, wolfKing: true };
  if (!shootRoles[roleId]) return { canShoot: false, reason: "呢個角色唔可以開槍" };
  if (deathEntry.causes.indexOf("poison") >= 0) return { canShoot: false, reason: "中毒，唔可以開槍" };
  if (deathEntry.causes.indexOf("knife") >= 0 || deathEntry.causes.indexOf("naiChuan") >= 0) {
    return { canShoot: true, reason: deathEntry.causes.indexOf("naiChuan") >= 0 ? "奶穿視作被刀，可以開槍" : "被刀，可以開槍" };
  }
  return { canShoot: false, reason: "唔符合開槍條件" };
}

function checkVictory(seats, winCondition) {
  winCondition = winCondition || "city";
  var living = (seats || []).filter(function (s) { return s.alive && !s.exiledAsIdiot; });
  /* 白痴翻牌後仍算存活（exiledAsIdiot 標記但 alive=true） */
  living = (seats || []).filter(function (s) { return s.alive; });
  var wolves = living.filter(function (s) { return campOf(s.roleId) === "wolf"; });
  var goods = living.filter(function (s) { return campOf(s.roleId) !== "wolf" && campOf(s.roleId) !== "third"; });
  var gods = living.filter(function (s) { return campOf(s.roleId) === "god"; });
  var villagers = living.filter(function (s) { return campOf(s.roleId) === "villager"; });
  if (wolves.length === 0 && goods.length > 0) return { over: true, winner: "good", text: "好人陣營勝利！所有狼人已經出局。" };
  if (goods.length === 0 && wolves.length > 0) return { over: true, winner: "wolf", text: "狼人陣營勝利！所有好人已經出局（屠城）。" };
  if (winCondition === "side") {
    if (gods.length === 0 && wolves.length > 0) return { over: true, winner: "wolf", text: "狼人陣營勝利！神職已經全部出局（屠邊·屠神）。" };
    if (villagers.length === 0 && wolves.length > 0) return { over: true, winner: "wolf", text: "狼人陣營勝利！平民已經全部出局（屠邊·屠民）。" };
  }
  return { over: false, winner: null, text: "" };
}

function applyDoubleExplode(dayState) {
  dayState = dayState || {};
  var count = Number(dayState.explodeCountToday) || 0;
  var next = {
    explodeCountToday: count,
    badgeSwallowed: !!dayState.badgeSwallowed,
    badgeSeat: dayState.badgeSeat == null ? null : dayState.badgeSeat,
    canTransferBadge: dayState.canTransferBadge !== false
  };
  if (count >= 2) {
    next.badgeSwallowed = true;
    next.badgeSeat = null;
    next.canTransferBadge = false;
  }
  return next;
}

function registerExplode(dayState) {
  dayState = dayState || { explodeCountToday: 0 };
  var count = (Number(dayState.explodeCountToday) || 0) + 1;
  return applyDoubleExplode({
    explodeCountToday: count,
    badgeSwallowed: dayState.badgeSwallowed,
    badgeSeat: dayState.badgeSeat,
    canTransferBadge: dayState.canTransferBadge
  });
}

function loadLS(key, fallback) {
  try {
    var raw = (typeof localStorage !== "undefined") ? localStorage.getItem(STORAGE_PREFIX + key) : null;
    if (raw == null || raw === "") return fallback;
    return JSON.parse(raw);
  } catch (e) { return fallback; }
}
function saveLS(key, val) {
  if (typeof localStorage === "undefined") return;
  localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(val));
}

function defaultCurrency() { return { score: 0, coins: 0, items: 0 }; }
function loadCurrency() {
  var c = loadLS("currency", defaultCurrency());
  return {
    score: Number(c && c.score) || 0,
    coins: Number(c && c.coins) || 0,
    items: Number(c && c.items) || 0
  };
}
function saveCurrency(c) { saveLS("currency", c); }
function incCurrency(which, delta) {
  var c = loadCurrency();
  if (which === "score" || which === "coins" || which === "items") {
    c[which] = Math.max(0, (Number(c[which]) || 0) + (delta == null ? 1 : Number(delta)));
    saveCurrency(c);
  }
  return c;
}

function importBackup(data, confirmOverwrite) {

function numOrNull(v) {
  if (v === null || v === undefined || v === "" || v === "abstain") return null;
  var n = Number(v);
  return isFinite(n) ? n : null;
}
function findSeatByRole(seats, roleId) {
  for (var i = 0; i < (seats || []).length; i++) if (seats[i].roleId === roleId) return seats[i].no;
  return null;
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function tallyVotes(votes, candidates) {
  /* votes: { voterNo: targetNo|'abstain' } */
  var counts = {};
  var abstain = 0;
  var list = candidates || [];
  for (var i = 0; i < list.length; i++) counts[list[i]] = 0;
  for (var k in votes) {
    if (!Object.prototype.hasOwnProperty.call(votes, k)) continue;
    var t = votes[k];
    if (t === "abstain" || t == null || t === "") { abstain++; continue; }
    t = Number(t);
    counts[t] = (counts[t] || 0) + 1;
  }
  var max = -1, tops = [];
  for (var id in counts) {
    if (!Object.prototype.hasOwnProperty.call(counts, id)) continue;
    var c = counts[id];
    if (c > max) { max = c; tops = [Number(id)]; }
    else if (c === max && c > 0) tops.push(Number(id));
  }
  if (max <= 0) return { counts: counts, abstain: abstain, tops: [], tie: false, winner: null, max: 0 };
  return { counts: counts, abstain: abstain, tops: tops, tie: tops.length > 1, winner: tops.length === 1 ? tops[0] : null, max: max };
}

function renderUI() {
  var exactHome = S.screen === "tabs" && S.tab === "boards";
  var app = $("app");
  if (app) {
    if (exactHome) app.classList.add("exact-home");
    else app.classList.remove("exact-home");
  }
  if (exactHome) {
    $("ui").innerHTML = viewBoardsLobby();
    return;
  }

  var body = "";
  if (S.screen === "tabs") {
    if (S.tab === "home") body = viewHome();
    else if (S.tab === "roles") body = viewRoles();
    else if (S.tab === "boards") body = viewBoardsLobby();
    else if (S.tab === "friends") body = viewFriends();
    else if (S.tab === "me") body = viewMe();
  } else if (S.screen === "open") body = viewOpen();
  else if (S.screen === "join") body = viewJoin();
  else if (S.screen === "board-list") body = viewBoardList();
  else if (S.screen === "board-edit") body = viewBoardEdit();
  else body = viewBoardsLobby();

  $("ui").innerHTML = renderPaintedTop() +
    '<div class="scroll" id="main-scroll">' + playBanner() + body + "</div>" +
    renderNav();
}

function playBanner() {
  if (!S.room || S.screen === "console") return "";
  if (S.room.phase === "ended") return "";
  return '<button class="banner-play" type="button" data-act="resume-game">' +
    "<span>對局進行中 · 房號 " + esc(S.room.code) + " · " + phaseLabel(S.room) + "</span>" +
    "<b>返回控制台</b></button>";
}

function phaseLabel(room) {
  if (!room) return "";
  if (room.phase === "setup") return "派牌準備";
  if (room.phase === "pass") return "傳閱看牌";
  if (room.phase === "night") return "第" + room.nightNumber + "夜";
  if (room.phase === "dawn") return "第" + room.nightNumber + "夜天亮";
  if (room.phase === "day") return "第" + room.dayNumber + "天白天";
  if (room.phase === "ended") return "已結束";
  return room.phase;
}

    "</div></div>";
}
function currencyAdjust(key, lab, n) {
  return '<div class="row-card"><div class="grow"><b>' + lab + "</b><span>點擊加減作測試，會存入本機</span></div>" +
    '<div class="counter">' +
    '<button type="button" data-act="inc-cur" data-key="' + key + '" data-delta="-1">−</button>' +
    "<b>" + n + "</b>" +
    '<button type="button" data-act="inc-cur" data-key="' + key + '" data-delta="1">+</button>' +
    "</div></div>";
}

function viewOpen() {
  var boards = allBoards();
  var s = S.setup;
  var chips = boards.map(function (b) {
    return '<button class="chip' + (s.boardId === b.id ? " on" : "") + '" type="button" data-act="setup-board" data-id="' + esc(b.id) + '">' + esc(b.name) + "</button>";
  }).join("");
  var b = findBoard(s.boardId);
  var counts = "";
  if (b) {
    counts = expandBoardRoles(b).map(function (id) { var r = findRole(id); return r ? r.name : id; }).join("、");
  }
  var nbtns = "";
  for (var i = 6; i <= 12; i++) {
    nbtns += '<button class="chip' + (Number(s.playerCount) === i ? " on" : "") + '" type="button" data-act="setup-n" data-n="' + i + '">' + i + "人</button>";
  }
  var mismatch = b && getBoardRoleTotal(b) !== Number(s.playerCount);
  return '<div class="page-pad"><div class="sec-title">開房 · 建立新局</div>' +
    '<button class="btn ghost" type="button" data-act="screen" data-id="tabs">‹ 返回大廳</button>' +
    '<div class="field"><label>選擇板子</label><div class="chips">' + chips + "</div></div>" +
    (b ? '<p class="hint">' + esc(b.notes || b.desc || "") + "<br>配置：" + esc(counts) + "</p>" : "") +
    '<div class="field"><label>人數（6–12）</label><div class="chips">' + nbtns + "</div></div>" +
    (mismatch ? '<p class="hint dead-mark">注意：板子角色合計 ' + getBoardRoleTotal(b) + " 人，同所選人數唔一致，請改人數或改板子。</p>" : "") +
    '<div class="chips">' +
      tog("setup-save", s.firstNightSelfSave, "首夜可自救") +
      tog("setup-sheriff", s.sheriffEnabled, "進行警上") +
      tog("setup-win", s.winCondition === "city", s.winCondition === "city" ? "勝利：屠城" : "勝利：屠邊") +
    "</div>" +
    '<button class="btn primary block" type="button" data-act="create-room">生成 4 位房號並進入控制台</button>' +
    '<div class="board-more"><button class="linkish" type="button" data-act="screen" data-id="board-list">管理自訂板子 ›</button></div>' +
    "</div>";
}
function tog(act, on, lab) {
  return '<button class="chip' + (on ? " on" : "") + '" type="button" data-act="' + act + '">' + lab + "</button>";
}

function viewJoin() {
  var recent = loadRecent();
  var rooms = loadRooms();
  var rows = recent.map(function (code) {
    var r = rooms[code];
    if (!r) return "";
    return '<div class="row-card"><div class="grow"><b>房號 ' + esc(r.code) + "</b><span>" +
      esc(r.boardName || "") + " · " + phaseLabel(r) + " · " + fmtTime(r.updatedAt || r.createdAt) +
      "</span></div><button class=\"btn primary\" type=\"button\" data-act=\"resume-code\" data-code=\"" + esc(r.code) + '">恢復</button></div>';
  }).join("");
  return '<div class="page-pad"><div class="sec-title">跟房 · 加入局房</div>' +
    '<button class="btn ghost" type="button" data-act="screen" data-id="tabs">‹ 返回大廳</button>' +
    '<div class="field"><label>輸入 4 位房號</label>' +
    '<input id="join-code" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="例如 1234" value="' + esc(S.joinCode) + '"></div>' +
    '<button class="btn primary block" type="button" data-act="do-join">進入房間</button>' +
    '<div class="sec-title">最近本地房間紀錄</div>' +
    (rows || '<p class="hint">未有紀錄。</p>') +
    '<div class="list">' + rows + "</div></div>";
}

function viewBoardList() {
  var defs = DEFAULT_BOARDS.map(function (b) {
    return '<div class="row-card"><div class="grow"><b>' + esc(b.name) + "</b><span>" + esc(b.notes) + " · " + b.playerCount + "人 · " + (b.winCondition === "city" ? "屠城" : "屠邊") +
      '</span></div><button class="btn ghost" type="button" data-act="clone-board" data-id="' + b.id + '">另存自訂</button></div>';
  }).join("");
  var customs = loadCustomBoards().map(function (b) {
    return '<div class="row-card"><div class="grow"><b>' + esc(b.name) + "</b><span>" + (b.notes || "") + " · " + getBoardRoleTotal(b) + "人</span></div>" +
      '<button class="btn" type="button" data-act="edit-board" data-id="' + esc(b.id) + '">編輯</button>' +
      '<button class="btn danger" type="button" data-act="del-board" data-id="' + esc(b.id) + '">刪</button></div>';
  }).join("");
  return '<div class="page-pad"><div class="sec-title">板子庫</div>' +
    '<button class="btn ghost" type="button" data-act="screen" data-id="tabs">‹ 返回大廳</button>' +
    '<div class="sec-title">預設板子</div><div class="list">' + defs + "</div>" +
    '<div class="sec-title">自訂板子</div>' +
    (customs || '<p class="hint">未有自訂板子。</p>') +
    '<div class="list">' + customs + "</div>" +
    '<button class="btn primary block" type="button" data-act="new-board">新建自訂板子</button></div>';
}

function viewBoardEdit() {
  var f = S.ui.boardForm;
  if (!f) return "";
  var rows = ROLES_CONFIG.map(function (r) {
    var n = Number(f.roles[r.id] || 0);
    return '<div class="role-edit"><div class="nm"><span class="s">' + roleSvg(r.id) + "</span><span>" + esc(r.name) +
      " <small class='tiny'>" + CAMP_LABEL[r.camp] + "</small></span></div>" +
      '<div class="counter">' +
      '<button type="button" data-act="board-role" data-id="' + r.id + '" data-delta="-1">−</button>' +
      "<b>" + n + "</b>" +
      '<button type="button" data-act="board-role" data-id="' + r.id + '" data-delta="1">+</button>' +
      "</div></div>";
  }).join("");
  var total = getBoardRoleTotal(f);
  return '<div class="page-pad"><div class="sec-title">編輯板子</div>' +
    '<button class="btn ghost" type="button" data-act="screen" data-id="board-list">‹ 返回板子庫</button>' +
    '<div class="field"><label>板子名稱</label><input id="bf-name" value="' + esc(f.name) + '"></div>' +
    '<div class="field"><label>備註</label><input id="bf-notes" value="' + esc(f.notes || "") + '"></div>' +
    '<div class="chips">' +
      tog("bf-save", f.firstNightSelfSave, "首夜可自救") +
      tog("bf-sheriff", f.sheriffEnabled, "預設警上") +
      tog("bf-win", f.winCondition === "city", f.winCondition === "city" ? "屠城" : "屠邊") +
    "</div>" +
    '<p class="hint">角色合計：<b class="gold">' + total + "</b> 人（建議 6–12）</p>" +
    rows +
    '<div class="btn-row"><button class="btn primary" type="button" data-act="save-board">儲存板子</button></div></div>';
}

function fmtTime(iso) {
  if (!iso) return "";
  try {
    var d = new Date(iso);
    var p = function (n) { return n < 10 ? "0" + n : "" + n; };
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  } catch (e) { return ""; }
}
function renderOverlay() {
  var root = $("overlay-root");
  if (S.screen !== "console" || !S.room) { root.innerHTML = ""; return; }
  var room = S.room;
  var html = '<div class="console"><div class="c-head">' +
    '<button class="btn ghost" type="button" data-act="leave-console">離開</button>' +
    '<div class="code">房號 ' + esc(room.code) + "</div>" +
    '<div class="meta">' + esc(room.boardName) + " · " + phaseLabel(room) + "</div>" +
    '<button class="btn ghost" type="button" data-act="copy-recap">復盤</button>' +
    "</div><div class=\"c-body\">" + viewConsole(room) + "</div></div>";
  root.innerHTML = html;
}

function viewConsole(room) {
  if (room.phase === "setup") return viewSetup(room);
  if (room.phase === "pass") return viewPass(room);
  if (room.phase === "night") return viewNight(room);
  if (room.phase === "dawn") return viewDawn(room);
  if (room.phase === "day") return viewDay(room);
  if (room.phase === "ended") return viewEnded(room);
  return viewSetup(room);
}

function seatsGrid(room, opts) {
  opts = opts || {};
  return '<div class="seats">' + room.seats.map(function (s) {
    var role = findRole(s.roleId);
    var cls = "seat";
    if (!s.alive) cls += " dead";
    if (s.isSheriff) cls += " sheriff";
    if (opts.picked === s.no) cls += " picked";
    if (opts.highlight && opts.highlight.indexOf(s.no) >= 0) cls += " picked";
    var act = opts.act ? ' data-act="' + opts.act + '" data-no="' + s.no + '"' : "";
    var extra = "";
    if (opts.showRole && role) extra += '<div class="av">' + avatarHTML(role) + "</div><div class='rn'>" + esc(role.name) + (s.exiledAsIdiot ? "（白痴翻牌）" : "") + "</div>";
    else if (opts.showCovered) extra += '<div class="rn">' + (s.hasBeenShown ? "已傳閱" : "未看") + (s.roleId ? " · 已派" : " · 空") + "</div>";
    if (s.friendName) extra += '<div class="tiny">' + esc(s.friendName) + "</div>";
    if (!s.alive) extra += '<div class="tiny dead-mark">出局</div>';
    if (s.lostVote) extra += '<div class="tiny">失票權</div>';
    return '<button class="' + cls + '" type="button"' + act + '><div class="no">' + s.no + "號</div>" + extra + "</button>";
  }).join("") + "</div>";
}

function viewSetup(room) {
  var remain = remainingRoles(room);
  var remainTxt = remain.length ? remain.map(function (id) { var r = findRole(id); return r ? r.name : id; }).join("、") : "已全部分配";
  var pick = S.ui.assignRole;
  var roleChips = ROLES_CONFIG.map(function (r) {
    var left = remain.filter(function (id) { return id === r.id; }).length;
    if (!left && pick !== r.id) return "";
    return '<button class="chip' + (pick === r.id ? " on" : "") + '" type="button" data-act="pick-role" data-id="' + r.id + '">' + esc(r.name) + (left ? " ×" + left : "") + "</button>";
  }).join("");
  var friends = loadFriends();
  return '<p class="hint">請先派牌。可以一鍵隨機，或者先揀角色再點座位手動指定。傳閱看牌建議喺派完之後進行。</p>' +
    '<div class="btn-row">' +
      '<button class="btn primary" type="button" data-act="random-assign">一鍵隨機分配</button>' +
      '<button class="btn ghost" type="button" data-act="clear-assign">清空身份</button>' +
    "</div>" +
    '<div class="field"><label>手動指定（先揀角色，再點座位）</label><div class="chips">' + roleChips + "</div>" +
    '<p class="hint">剩餘：' + esc(remainTxt) + "</p></div>" +
    seatsGrid(room, { act: "assign-seat", showRole: true, picked: null }) +
    (friends.length ? '<div class="field"><label>將座位關聯好友（選填）</label>' +
      room.seats.map(function (s) {
        return '<div class="role-edit"><span>' + s.no + "號</span><select data-act-change=\"link-friend\" data-no=\"" + s.no + '">' +
          '<option value="">（無）</option>' +
          friends.map(function (f) {
            return '<option value="' + esc(f.id) + '"' + (s.friendId === f.id ? " selected" : "") + ">" + esc(f.nickname) + "</option>";
          }).join("") + "</select></div>";
      }).join("") + "</div>" : "") +
    '<div class="btn-row">' +
      '<button class="btn" type="button" data-act="goto-pass">進入傳閱看牌</button>' +
      '<button class="btn primary" type="button" data-act="start-night">開始天黑</button>' +
    "</div>";
}

function remainingRoles(room) {
  var need = expandBoardRoles({ roles: room.roles });
  var used = room.seats.map(function (s) { return s.roleId; }).filter(Boolean);
  used.forEach(function (id) {
    var i = need.indexOf(id);
    if (i >= 0) need.splice(i, 1);
  });
  return need;
}

function viewPass(room) {
  var seat = room.seats.filter(function (s) { return s.no === S.ui.passSeat; })[0];
  var flip = "";
  if (seat && seat.roleId) {
    var role = findRole(seat.roleId);
    flip = '<div class="flipbox' + (S.ui.flipOpen ? " open" : "") + '" data-act="toggle-flip">' +
      '<div class="flipbox-inner">' +
        '<div class="face face-front">' + cardBackHTML() + '<div class="mark">' + seat.no + '</div><p class="hint">點擊翻開底牌</p></div>' +
        '<div class="face face-back"><div class="av">' + (role ? avatarHTML(role) : "") + "</div><h2>" + (role ? esc(role.name) : "") +
        "</h2><p>" + seat.no + "號 · " + (role ? CAMP_LABEL[role.camp] : "") + "</p><p class='tiny'>再點一次蓋牌，防止旁邊偷看</p></div>" +
      "</div></div>";
  }
  return '<p class="speech">傳閱看牌模式：請將畫面交給對應玩家，點座位翻開底牌，睇完必須再點蓋牌，先傳下一位。</p>' +
    seatsGrid(room, { act: "pass-seat", showCovered: true, picked: S.ui.passSeat }) +
    flip +
    '<div class="btn-row">' +
      '<button class="btn ghost" type="button" data-act="back-setup">返回派牌</button>' +
      '<button class="btn primary" type="button" data-act="start-night">完成，開始天黑</button>' +
    "</div>";
}

function viewNight(room) {
  var steps = room.nightSteps || [];
  var idx = room.nightStepIndex || 0;
  var step = steps[idx];
  if (!step) return '<p class="speech">夜晚步驟已結束。</p><button class="btn primary block" data-act="to-dawn">進入天亮</button>';
  var dots = '<div class="steps-dot">' + steps.map(function (st, i) {
    return "<i class='" + (i === idx ? "on" : (i < idx ? "done" : "")) + "'></i>";
  }).join("") + "</div>";
  if (S.ui.nightClosing) {
    return dots + '<div class="speech">' + esc(step.close || "請閉眼。") + "<small>確認全場已閉眼，再進入下一項。</small></div>" +
      '<button class="btn primary block" type="button" data-act="night-next">繼續</button>';
  }
  var speech = nightSpeech(room, step);
  var body = "";
  if (step.type === "announce") {
    body = '<button class="btn primary block" type="button" data-act="night-confirm">全場已閉眼，繼續</button>';
  } else if (step.type === "pick") {
    body = seatsGrid(room, { act: "night-pick", showRole: false, picked: S.ui.pickSeat }) +
      (step.allowSkip ? '<button class="btn ghost block" type="button" data-act="night-skip">' + esc(step.skipLabel || "跳過") + "</button>" : "") +
      (S.ui.seerResult ? '<div class="speech">' + S.ui.seerResult + "</div>" : "") +
      '<button class="btn primary block" type="button" data-act="night-confirm">確認並請閉眼</button>';
  } else if (step.type === "witch") {
    body = viewWitch(room);
  } else if (step.type === "status") {
    body = viewStatus(room, step);
  } else if (step.type === "dawn") {
    body = '<button class="btn primary block" type="button" data-act="to-dawn">結算並天亮</button>';
  }
  return dots + '<div class="speech">' + speech + "</div>" + body;
}

function livingNos(room) {
  return room.seats.filter(function (s) { return s.alive; }).map(function (s) { return s.no; });
}

function nightSpeech(room, step) {
  if (step.type !== "witch") return esc(step.speech || "");
  var kill = room.nightActions.wolfKill;
  var pot = room.witchPotions;
  var lines = "女巫請睜眼，";
  if (pot.antidote && kill) lines += "今晚死嘅係 " + kill + " 號，";
  else if (pot.antidote && !kill) lines += "今晚係空刀，冇人被刀。";
  else lines += "你解藥已經用咗，";
  var have = [];
  if (pot.antidote) have.push("一支解藥");
  if (pot.poison) have.push("一支毒藥");
  if (have.length) {
    if (pot.antidote && kill) lines += "你有" + have.join("同埋") + "，要唔要用？";
    else lines += "得返" + have.join("同埋") + "，要唔要用？";
  } else lines += "兩支藥都已經用咗。";
  return esc(lines);
}

function viewWitch(room) {
  var pot = room.witchPotions;
  var kill = room.nightActions.wolfKill;
  var witchSeat = findSeatByRole(room.seats, "witch");
  var canSave = pot.antidote && kill;
  if (canSave && witchSeat === kill && !(room.nightNumber === 1 && room.settings.firstNightSelfSave)) canSave = false;
  var act = S.ui.witchAct;
  var html = '<div class="btn-row">';
  if (pot.antidote) html += '<button class="btn' + (act === "save" ? " primary" : "") + (canSave ? "" : " ghost") + '" type="button" data-act="witch-save"' + (canSave ? "" : " disabled") + ">使用解藥" + (kill ? "（救" + kill + "號）" : "（無人可救）") + "</button>";
  else html += '<button class="btn ghost" type="button" disabled>解藥已用</button>';
  if (pot.poison) html += '<button class="btn' + (act === "poison" ? " primary" : "") + '" type="button" data-act="witch-poison-mode">使用毒藥</button>';
  else html += '<button class="btn ghost" type="button" disabled>毒藥已用</button>';
  html += '<button class="btn ghost" type="button" data-act="witch-skip">兩藥都唔用</button></div>';
  if (act === "poison") {
    html += '<p class="hint">請選擇目標座位：</p>' + seatsGrid(room, { act: "night-pick", picked: S.ui.pickSeat });
  }
  if (room.settings.firstNightSelfSave && room.nightNumber === 1) html += '<p class="tiny">本局設定：首夜可自救。</p>';
  if (!room.settings.firstNightSelfSave) html += '<p class="tiny">本局設定：首夜唔可以自救。</p>';
  html += '<button class="btn primary block" type="button" data-act="night-confirm">確認並請閉眼</button>';
  return html;
}

function viewStatus(room, step) {
  var preview = previewNight(room);
  var seats = room.seats.filter(function (s) { return s.roleId === step.roleId; });
  var html = seats.map(function (s) {
    var death = null;
    preview.deaths.forEach(function (d) { if (d.seat === s.no) death = d; });
    var st = hunterShootStatus(step.roleId, death);
    if (!s.alive && !death) st = { canShoot: false, reason: "已出局" };
    if (s.alive && !death) st = { canShoot: true, reason: "仍然存活，狀態正常（可以開槍）" };
    return '<div class="row-card"><div class="grow"><b>' + s.no + "號" + (findRole(s.roleId) ? findRole(s.roleId).name : "") +
      "</b><span>" + esc(st.reason) + '</span></div><b class="' + (st.canShoot ? "ok-mark" : "dead-mark") + '">' +
      (st.canShoot ? "可以開槍" : "唔可以開槍") + "</b></div>";
  }).join("");
  return html + '<p class="hint">請向該角色出示手勢，然後確認閉眼。</p>' +
    '<button class="btn primary block" type="button" data-act="night-confirm">確認並請閉眼</button>';
}

function previewNight(room) {
  return resolveNight({
    seats: room.seats,
    wolfKill: room.nightActions.wolfKill,
    guardTarget: room.nightActions.guardTarget,
    witchSave: !!room.nightActions.witchSave,
    witchSaveTarget: room.nightActions.witchSaveTarget,
    witchPoison: room.nightActions.witchPoison,
    witchPotions: { antidote: room.witchPotions.antidote, poison: room.witchPotions.poison },
    nightNumber: room.nightNumber,
    firstNightSelfSave: room.settings.firstNightSelfSave,
    lastGuardTarget: room.lastGuardTarget,
    witchSeat: findSeatByRole(room.seats, "witch")
  });
}
function viewDawn(room) {
  var res = room.lastNightResult || previewNight(room);
  var guns = (res.deaths || []).map(function (d) {
    var seat = room.seats.filter(function (s) { return s.no === d.seat; })[0];
    if (!seat) return "";
    if (seat.roleId !== "hunter" && seat.roleId !== "wolfKing") return "";
    var st = hunterShootStatus(seat.roleId, d);
    if (!st.canShoot) {
      return '<div class="row-card"><div class="grow"><b>' + seat.no + "號" + findRole(seat.roleId).name +
        "</b><span>" + esc(st.reason) + "</span></div><span class='dead-mark'>唔可以開槍</span></div>";
    }
    return '<div class="row-card" style="flex-wrap:wrap"><div class="grow"><b>' + seat.no + "號" + findRole(seat.roleId).name +
      " 可以開槍</b><span>選擇帶走邊個，或者放棄</span></div></div>" +
      seatsGrid(room, { act: "gun-pick", picked: S.ui.gunTarget }) +
      '<div class="btn-row"><button class="btn primary" type="button" data-act="gun-fire" data-from="' + seat.no + '">開槍帶走</button>' +
      '<button class="btn ghost" type="button" data-act="gun-skip" data-from="' + seat.no + '">放棄開槍</button></div>';
  }).join("");
  return '<div class="speech">' + esc(res.dawnSpeech || "天亮請睜眼。") + "</div>" +
    (guns || "") +
    '<div class="sec-title">昨夜摘要</div>' +
    '<p class="hint">' + esc(nightSummary(room, res)) + "</p>" +
    seatsGrid(room, { showRole: true }) +
    '<button class="btn primary block" type="button" data-act="enter-day">進入白天</button>';
}

function nightSummary(room, res) {
  var a = room.nightActions || {};
  var parts = [];
  if (a.guardTarget) parts.push("守衛守" + a.guardTarget + "號");
  parts.push(a.wolfKill ? "狼人刀" + a.wolfKill + "號" : "狼人空刀");
  if (a.witchSave) parts.push("女巫救" + (a.witchSaveTarget || a.wolfKill) + "號");
  if (a.witchPoison) parts.push("女巫用毒藥，目標" + a.witchPoison + "號");
  if (a.seerCheck) {
    var t = room.seats.filter(function (s) { return s.no === a.seerCheck; })[0];
    var camp = t ? campOf(t.roleId) : "";
    parts.push("預言家查" + a.seerCheck + "號（" + (camp === "wolf" ? "查殺" : "金水") + "）");
  }
  if (res && res.deaths && res.deaths.length) {
    parts.push("死亡：" + res.deaths.map(function (d) { return d.seat + "號(" + d.causes.join("/") + ")"; }).join("、"));
  } else parts.push("平安夜");
  return parts.join("；");
}

function viewDay(room) {
  var sub = room.daySub || "announce";
  if (sub === "sheriff-reg" || sub === "sheriff-vote" || sub === "sheriff-pk") return viewSheriff(room, sub);
  if (sub === "vote" || sub === "pk") return viewVote(room, sub);
  if (sub === "badge") return viewBadge(room);
  return viewTalk(room);
}

function viewSheriff(room, sub) {
  var sh = room.sheriff;
  if (sub === "sheriff-reg") {
    return '<div class="speech">進入警上競選。點擊座位上警／取消；已經上警嘅可以退水。</div>' +
      seatsGrid(room, { act: "sher-toggle", showRole: false, highlight: sh.candidates }) +
      '<p class="hint">上警名單：' + (sh.candidates.length ? sh.candidates.map(function (n) { return n + "號"; }).join("、") : "（空）") +
      (sh.withdrawn.length ? "；已退水：" + sh.withdrawn.map(function (n) { return n + "號"; }).join("、") : "") + "</p>" +
      '<div class="btn-row">' +
        '<button class="btn ghost" type="button" data-act="sher-skip">跳過警上（本局無警長）</button>' +
        '<button class="btn primary" type="button" data-act="sher-to-vote">開始投票選警</button>' +
      "</div>";

  var cands = sub === "sheriff-pk" ? (sh.pk || []) : sh.candidates.filter(function (n) { return sh.withdrawn.indexOf(n) < 0; });
  return '<div class="speech">' + (sub === "sheriff-pk" ? "警上平票 PK，請喺平票者之間再投一輪。" : "請記錄每一位未上警／未退水玩家投給邊個。") + "</div>" +
    voteForm(room, cands) +

}

function voteForm(room, cands) {
  var html = '<div class="list">';
  room.seats.forEach(function (s) {
    if (!s.alive || s.lostVote) return;
    var v = S.ui.voteFor[s.no];
    html += '<div class="row-card" style="flex-wrap:wrap"><div class="grow"><b>' + s.no + '號投票</b></div><div class="chips">';
    cands.forEach(function (c) {
      if (c === s.no) return;
      html += '<button class="chip' + (Number(v) === c ? " on" : "") + '" type="button" data-act="cast-vote" data-from="' + s.no + '" data-to="' + c + '">' + c + "號</button>";
    });
    html += '<button class="chip' + (v === "abstain" ? " on" : "") + '" type="button" data-act="cast-vote" data-from="' + s.no + '" data-to="abstain">棄票</button>';
    html += "</div></div>";
  });
  return html + "</div>";
}

function viewVote(room, sub) {

function voteHistory(room) {
  if (!room.dayVotes || !room.dayVotes.length) return "";

    var detail = [];
    for (var k in v.votes) detail.push(k + "→" + (v.votes[k] === "abstain" ? "棄" : v.votes[k] + "號"));
    return "<tr><td>第" + v.day + "天</td><td>" + esc(v.type) + "</td><td>" + esc(detail.join("，")) + "</td><td>" + (v.result ? v.result + "號" : (v.tie ? "平票" : "無人")) + "</td></tr>";
  }).join("");
  return '<div class="sec-title">投票記錄表</div><table class="vote-table"><thead><tr><th>日</th><th>類型</th><th>誰投給誰</th><th>結果</th></tr></thead><tbody>' + rows + "</tbody></table>";

function renderToast() {
  var root = $("toast-root");
  root.innerHTML = S.toast ? '<div class="toast">' + esc(S.toast) + "</div>" : "";
}
document.addEventListener("click", function (e) {
  var mask = e.target.closest && e.target.closest(".modal-mask");
  var stop = e.target.closest && e.target.closest("[data-stop]");
  if (mask && !stop && e.target === mask) { S.modal = null; renderModal(); return; }
  var el = e.target.closest && e.target.closest("[data-act]");
  if (!el) return;
  if (el.hasAttribute("disabled")) return;
  handleAct(el.getAttribute("data-act"), el, e);
});
document.addEventListener("change", function (e) {
  var el = e.target;
  if (!el) return;
  if (el.id === "import-file" && el.files && el.files[0]) {
    var fr = new FileReader();
    fr.onload = function () { var ta = $("import-json"); if (ta) ta.value = fr.result; };
    fr.readAsText(el.files[0]);
    return;
  }
  if (el.id === "profile-file" && el.files && el.files[0]) {
    compressAvatarFile(el.files[0], function (url) {
      if (!url) { toast("無法讀取相片"); return; }
      if (!S.ui.profileDraft) S.ui.profileDraft = loadProfile();
      S.ui.profileDraft.avatarDataUrl = url;
      var nameInp = $("profile-name-input");
      if (nameInp) S.ui.profileDraft.name = nameInp.value;
      renderModal();
    });
    return;
  }
  var act = el.getAttribute("data-act-change");
  if (act === "link-friend") linkFriend(Number(el.getAttribute("data-no")), el.value);
});

function handleAct(act, el) {
  var ds = el.dataset || {};
  switch (act) {
    case "tab":
      S.tab = ds.id; S.screen = "tabs"; renderAll(); break;
    case "screen":
      S.screen = ds.id; renderAll(); break;
    case "open-judge": S.modal = { type: "judge" }; renderModal(); break;
    case "open-profile":
      S.ui.profileDraft = loadProfile();
      S.modal = { type: "profile", center: true };
      renderModal();
      break;
    case "save-profile": {
      var inp = $("profile-name-input");
      var draft = S.ui.profileDraft || loadProfile();
      if (inp) draft.name = inp.value;
      saveProfile(draft);
      S.ui.profileDraft = null;
      S.modal = null;
      toast("已儲存檔案");
      renderAll();
      break;
    }
    case "clear-avatar":
      if (!S.ui.profileDraft) S.ui.profileDraft = loadProfile();
      S.ui.profileDraft.avatarDataUrl = "";
      renderModal();
      break;
    case "open-intro": S.modal = { type: "intro" }; renderModal(); break;
    case "close-modal": S.modal = null; renderModal(); break;
    case "mask-close": break;
    case "inc-cur":
      incCurrency(ds.key, ds.delta == null ? 1 : Number(ds.delta));
      renderAll(); toast("已更新" + (ds.key === "score" ? "精分" : ds.key === "coins" ? "幣" : "道具"));
      break;
    case "mode": startOpen(ds.id); break;
    case "goto-open": startOpen(S.setup.boardId || "advanced-12-white"); break;
    case "goto-join": S.screen = "join"; renderAll(); break;
    case "setup-board": applySetupBoard(ds.id); renderAll(); break;
    case "setup-n": S.setup.playerCount = Number(ds.n); renderAll(); break;
    case "setup-save": S.setup.firstNightSelfSave = !S.setup.firstNightSelfSave; renderAll(); break;
    case "setup-sheriff": S.setup.sheriffEnabled = !S.setup.sheriffEnabled; renderAll(); break;
    case "setup-win": S.setup.winCondition = S.setup.winCondition === "city" ? "side" : "city"; renderAll(); break;
    case "create-room": createRoomFromSetup(); break;
    case "do-join":
      var inp = $("join-code"); S.joinCode = inp ? inp.value : S.joinCode; joinRoom(S.joinCode); break;
    case "resume-game": if (S.room) { S.screen = "console"; renderAll(); } break;
    case "resume-code": joinRoom(ds.code); break;
    case "leave-console": S.screen = "tabs"; renderAll(); break;
    case "leave-ended": S.room = null; S.screen = "tabs"; renderAll(); break;
    case "random-assign": randomAssign(); break;
    case "clear-assign": clearAssign(); break;
    case "pick-role": S.ui.assignRole = ds.id; renderAll(); break;
    case "assign-seat": assignSeat(Number(ds.no)); break;
    case "goto-pass": gotoPass(); break;
    case "back-setup": S.room.phase = "setup"; persistRoom(); S.ui.flipOpen = false; S.ui.passSeat = null; renderAll(); break;
    case "pass-seat":
      S.ui.passSeat = Number(ds.no); S.ui.flipOpen = false; renderAll(); break;
    case "toggle-flip": toggleFlip(); break;
    case "start-night": startNight(); break;
    case "night-pick": S.ui.pickSeat = Number(ds.no); onNightPick(); renderAll(); break;
    case "night-skip": S.ui.pickSeat = null; S.ui.witchAct = "skip"; renderAll(); break;
    case "night-confirm": confirmNightStep(); break;
    case "night-next": S.ui.nightClosing = false; S.room.nightStepIndex++; persistRoom(); renderAll(); break;
    case "witch-save": S.ui.witchAct = "save"; S.ui.pickSeat = S.room.nightActions.wolfKill; renderAll(); break;
    case "witch-poison-mode": S.ui.witchAct = "poison"; S.ui.pickSeat = null; renderAll(); break;
    case "witch-skip": S.ui.witchAct = "skip"; S.ui.pickSeat = null; renderAll(); break;
    case "to-dawn": applyDawn(); break;
    case "gun-pick": S.ui.gunTarget = Number(ds.no); renderAll(); break;
    case "gun-fire": doGun(Number(ds.from), S.ui.gunTarget); break;
    case "gun-skip": doGun(Number(ds.from), null); break;
    case "enter-day": enterDay(); break;
    case "sher-toggle": sherToggle(Number(ds.no)); break;
    case "sher-skip": sherSkip(); break;
    case "sher-to-vote": sherToVote(); break;
    case "cast-vote":
      S.ui.voteFor[Number(ds.from)] = ds.to === "abstain" ? "abstain" : Number(ds.to); renderAll(); break;
    case "sher-tally": sherTally(); break;
    case "to-vote": S.room.daySub = "vote"; S.ui.voteFor = {}; persistRoom(); renderAll(); break;
    case "tally-exile": tallyExile(); break;
    case "pick-explode": S.ui.explodeSeat = Number(ds.no); renderAll(); break;
    case "ww-pick": S.ui.wwTarget = Number(ds.no); renderAll(); break;
    case "do-explode": doExplode(); break;
    case "badge-to": S.ui.badgeTo = Number(ds.no); renderAll(); break;
    case "badge-transfer": badgeTransfer(); break;
    case "badge-tear": badgeTear(); break;
    case "badge-swallow": badgeSwallow(); break;
    case "copy-recap": copyRecap(); break;
    case "flip-tarot": el.classList.toggle("flip"); break;
    case "role-filter": S.ui.roleFilter = ds.id; renderAll(); break;
    case "save-friend": saveFriendForm(); break;
    case "edit-friend": editFriend(ds.id); break;
    case "del-friend": confirmAct("刪除好友", "確認刪除呢位常客？", function () { delFriend(ds.id); }); break;
    case "reset-friend": S.ui.friendForm = { id: "", nickname: "", seat: "", note: "" }; renderAll(); break;
    case "clone-board": cloneBoard(ds.id); break;
    case "edit-board": openBoardEdit(ds.id); break;
    case "new-board": openBoardEdit(null); break;
    case "del-board": confirmAct("刪除板子", "確認刪除呢個自訂板子？", function () { delBoard(ds.id); }); break;
    case "board-role": changeBoardRole(ds.id, Number(ds.delta)); break;
    case "bf-save": S.ui.boardForm.firstNightSelfSave = !S.ui.boardForm.firstNightSelfSave; renderAll(); break;
    case "bf-sheriff": S.ui.boardForm.sheriffEnabled = !S.ui.boardForm.sheriffEnabled; renderAll(); break;
    case "bf-win": S.ui.boardForm.winCondition = S.ui.boardForm.winCondition === "city" ? "side" : "city"; renderAll(); break;
    case "save-board": saveBoardForm(); break;
    case "export-json": doExport(); break;
    case "import-open": S.modal = { type: "import", center: true }; renderModal(); break;
    case "do-import": doImport(); break;
    case "reset-currency": confirmAct("重置數值", "將精分、幣、道具歸零？", function () { saveCurrency(defaultCurrency()); renderAll(); toast("已重置"); }); break;
    case "clear-rooms": confirmAct("清除房間", "將刪除所有本機房間同最近紀錄，不可復原。", function () { saveRooms({}); saveRecent([]); S.room = null; renderAll(); toast("已清除房間"); }); break;
    case "cheat-tab": S.ui.cheatTab = ds.id; renderModal(); break;
    case "confirm-ok":
      var fn = S.modal && S.modal.fn; S.modal = null; renderModal(); if (typeof fn === "function") fn(); break;
    case "knight-duel": startKnightDuel(); break;
    case "knight-pick": S.ui.knightTarget = Number(ds.no); renderAll(); break;
    case "knight-go": doKnightDuel(); break;
  }
}

function confirmAct(title, text, fn) {
  S.modal = { type: "confirm", center: true, title: title, text: text, fn: fn };
  renderModal();
}

function startOpen(boardId) {
  applySetupBoard(boardId || "advanced-12-white");
  S.screen = "open";
  S.tab = "boards";
  renderAll();
}
function applySetupBoard(id) {
  var b = findBoard(id);
  S.setup.boardId = id;
  if (b) {
    S.setup.playerCount = b.playerCount || getBoardRoleTotal(b);
    S.setup.firstNightSelfSave = b.firstNightSelfSave !== false;
    S.setup.winCondition = b.winCondition || "city";
    S.setup.sheriffEnabled = b.sheriffEnabled !== false;
  }
}

function createRoomFromSetup() {
  var b = findBoard(S.setup.boardId);
  if (!b) { toast("請先選擇板子"); return; }
  var n = Number(S.setup.playerCount) || getBoardRoleTotal(b);
  if (n < 6 || n > 12) { toast("人數須為 6 至 12"); return; }
  if (getBoardRoleTotal(b) !== n) {
    toast("板子合計 " + getBoardRoleTotal(b) + " 人，同所選人數唔一致，請改人數或改板子");
    return;
  }
  var rooms = loadRooms();
  var code = generateRoomCode(Object.keys(rooms));
  var seats = [];
  for (var i = 1; i <= n; i++) seats.push(emptySeat(i));
  S.room = {
    code: code,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    boardId: b.id,
    boardName: b.name,
    roles: JSON.parse(JSON.stringify(b.roles)),
    playerCount: n,
    settings: {
      firstNightSelfSave: !!S.setup.firstNightSelfSave,
      winCondition: S.setup.winCondition || "city",
      sheriffEnabled: !!S.setup.sheriffEnabled,
      noConsecutiveGuard: true,
      onePotionPerNight: true
    },
    seats: seats,
    phase: "setup",
    dayNumber: 0,
    nightNumber: 0,
    nightStepIndex: 0,
    nightSteps: [],
    nightActions: {},
    witchPotions: { antidote: true, poison: true },
    lastGuardTarget: null,
    lastNightResult: null,
    sheriff: { enabled: !!S.setup.sheriffEnabled, done: false, candidates: [], withdrawn: [], votes: {}, pk: null, badgeSeat: null, history: [], badgeSwallowed: false },
    dayVotes: [],
    explodeCountToday: 0,
    explodes: [],
    logs: [],
    winner: null,
    winnerText: "",
    daySub: "",
    pendingGuns: [],
    pendingBadgeFrom: null,
    pkCandidates: []
  };
  persistRoom();
  S.screen = "console";
  S.ui.assignRole = "";
  toast("房間已建立，房號 " + code);
  renderAll();
}

function emptySeat(i) {
  return { no: i, roleId: "", alive: true, isSheriff: false, friendId: null, friendName: "", nickname: "", hasBeenShown: false, lostVote: false, exiledAsIdiot: false };
}

function joinRoom(code) {
  code = String(code || "").replace(/\D/g, "");
  if (code.length !== 4) { toast("請輸入 4 位數字房號"); return; }
  var rooms = loadRooms();
  if (!rooms[code]) { toast("搵唔到呢個房號嘅本地紀錄"); return; }
  S.room = rooms[code];
  persistRoom();
  S.screen = "console";
  toast("已恢復房號 " + code);
  renderAll();
}

function persistRoom() {
  if (!S.room) return;
  S.room.updatedAt = new Date().toISOString();
  var rooms = loadRooms();
  rooms[S.room.code] = S.room;
  saveRooms(rooms);
  var recent = loadRecent().filter(function (c) { return c !== S.room.code; });
  recent.unshift(S.room.code);
  saveRecent(recent.slice(0, 24));
}

function log(text) {
  if (!S.room) return;
  S.room.logs = S.room.logs || [];
  S.room.logs.push({ t: new Date().toISOString(), text: text });
}

function randomAssign() {
  if (!S.room) return;
  var roles = shuffle(expandBoardRoles({ roles: S.room.roles }));
  if (roles.length !== S.room.seats.length) { toast("角色數量同座位數唔一致"); return; }
  for (var i = 0; i < S.room.seats.length; i++) {
    S.room.seats[i].roleId = roles[i];
    S.room.seats[i].hasBeenShown = false;
  }
  persistRoom(); toast("已隨機分配身份"); renderAll();
}
function clearAssign() {
  if (!S.room) return;
  S.room.seats.forEach(function (s) { s.roleId = ""; s.hasBeenShown = false; });
  persistRoom(); renderAll();
}
function assignSeat(no) {
  if (!S.room) return;
  var roleId = S.ui.assignRole;
  var seat = findSeat(S.room, no);
  if (!seat) return;
  if (!roleId) {
    if (seat.roleId) { seat.roleId = ""; seat.hasBeenShown = false; persistRoom(); renderAll(); }
    else toast("請先揀一個角色，再點座位");
    return;
  }
  var remain = remainingRoles(S.room);
  if (remain.indexOf(roleId) < 0 && seat.roleId !== roleId) { toast("呢個角色已經派完"); return; }
  seat.roleId = roleId;
  seat.hasBeenShown = false;
  persistRoom(); renderAll();
}
function linkFriend(no, fid) {
  var seat = findSeat(S.room, no);
  if (!seat) return;
  var f = loadFriends().filter(function (x) { return x.id === fid; })[0];
  seat.friendId = fid || null;
  seat.friendName = f ? f.nickname : "";
  persistRoom();
}

function allAssigned(room) {
  return room.seats.every(function (s) { return !!s.roleId; }) && remainingRoles(room).length === 0;
}
function gotoPass() {
  if (!allAssigned(S.room)) { toast("請先完成身份分配"); return; }
  S.room.phase = "pass"; S.ui.passSeat = null; S.ui.flipOpen = false; persistRoom(); renderAll();
}
function toggleFlip() {
  if (!S.ui.passSeat) return;
  S.ui.flipOpen = !S.ui.flipOpen;
  if (!S.ui.flipOpen) {
    var s = findSeat(S.room, S.ui.passSeat);
    if (s) s.hasBeenShown = true;
    persistRoom();
  }
  renderAll();
}
function startNight() {
  if (!allAssigned(S.room)) { toast("請先完成身份分配"); return; }
  if (S.room.phase === "pass" && S.ui.flipOpen) { toast("請先蓋牌再入夜，防止偷看"); return; }
  if (S.room.phase === "ended") return;
  var v = checkVictory(S.room.seats, S.room.settings.winCondition);
  if (v.over) return endGame(v);
  S.room.nightNumber = (S.room.nightNumber || 0) + 1;
  S.room.phase = "night";
  S.room.nightActions = { guardTarget: null, wolfKill: null, witchSave: false, witchSaveTarget: null, witchPoison: null, seerCheck: null };
  S.room.nightSteps = buildNightSteps(S.room);
  S.room.nightStepIndex = 0;
  S.ui.nightClosing = false;
  S.ui.pickSeat = null;
  S.ui.witchAct = "";
  S.ui.seerResult = null;
  S.ui.gunTarget = null;
  log("—— 第" + S.room.nightNumber + "夜 天黑 ——");
  persistRoom(); renderAll();
}

function buildNightSteps(room) {
  var steps = [];
  steps.push({ id: "dusk", type: "announce", title: "天黑", speech: "天黑請閉眼。", close: "" });
  function living(id) { return room.seats.some(function (s) { return s.roleId === id && s.alive; }); }
  function livingWolves() { return room.seats.some(function (s) { var r = findRole(s.roleId); return r && r.camp === "wolf" && r.joinsWolfNight !== false && s.alive; }); }
  if (living("guard")) steps.push({ id: "guard", type: "pick", roleId: "guard", title: "守衛", speech: "守衛請睜眼，今晚你想守邊個？", close: "守衛請閉眼。", allowSkip: true, skipLabel: "空守" });
  if (livingWolves()) {
    var sp = room.nightNumber === 1 ? "狼人請睜眼。狼人請互相確認身份。今晚你哋要殺邊個？" : "狼人請睜眼，今晚你哋要殺邊個？";
    steps.push({ id: "wolves", type: "pick", roleId: "wolf", title: "狼人刀人", speech: sp, close: "狼人請閉眼。", allowSkip: true, skipLabel: "空刀" });
  }
  if (living("witch") && (room.witchPotions.antidote || room.witchPotions.poison)) {
    steps.push({ id: "witch", type: "witch", roleId: "witch", title: "女巫", close: "女巫請閉眼。" });
  }
  if (living("seer")) steps.push({ id: "seer", type: "pick", roleId: "seer", title: "預言家查驗", speech: "預言家請睜眼，你想查驗邊個？", close: "預言家請閉眼。", allowSkip: false, showResult: true });
  if (room.seats.some(function (s) { return s.roleId === "hunter"; })) {
    steps.push({ id: "hunter", type: "status", roleId: "hunter", title: "獵人開槍狀態", speech: "獵人請睜眼。（法官出示開槍狀態）", close: "獵人請閉眼。" });
  }
  if (room.seats.some(function (s) { return s.roleId === "wolfKing"; })) {
    steps.push({ id: "wolfKing", type: "status", roleId: "wolfKing", title: "狼王開槍狀態", speech: "狼王請睜眼，確認你今晚嘅開槍狀態。", close: "狼王請閉眼。" });
  }
  steps.push({ id: "dawnReady", type: "dawn", title: "天亮", speech: "", close: "" });
  return steps;
}

function onNightPick() {
  var step = S.room.nightSteps[S.room.nightStepIndex];
  if (!step) return;
  if (step.id === "seer" && S.ui.pickSeat) {
    var t = findSeat(S.room, S.ui.pickSeat);
    if (t) {
      var isWolf = campOf(t.roleId) === "wolf";
      S.ui.seerResult = S.ui.pickSeat + "號係「" + (isWolf ? "查殺（狼人）" : "金水（好人）") + "」。請向預言家出示手勢。";
    }
  }
}

function confirmNightStep() {
  var room = S.room;
  var step = room.nightSteps[room.nightStepIndex];
  if (!step) { applyDawn(); return; }
  if (step.type === "announce") {
    room.nightStepIndex++; persistRoom(); renderAll(); return;
  }
  if (step.type === "dawn") { applyDawn(); return; }
  if (step.id === "guard") {
    if (S.ui.pickSeat && room.lastGuardTarget && S.ui.pickSeat === room.lastGuardTarget) {
      toast("唔可以連續兩晚守同一個人"); return;
    }
    room.nightActions.guardTarget = S.ui.pickSeat;
    if (S.ui.pickSeat) log("守衛守" + S.ui.pickSeat + "號"); else log("守衛空守");
  } else if (step.id === "wolves") {
    room.nightActions.wolfKill = S.ui.pickSeat;
    log(S.ui.pickSeat ? "狼人刀" + S.ui.pickSeat + "號" : "狼人空刀");
  } else if (step.id === "seer") {
    if (!S.ui.pickSeat) { toast("請選擇要查驗嘅玩家"); return; }
    room.nightActions.seerCheck = S.ui.pickSeat;
    var t = findSeat(room, S.ui.pickSeat);
    log("預言家查" + S.ui.pickSeat + "號（" + (t && campOf(t.roleId) === "wolf" ? "查殺" : "金水") + "）");
  } else if (step.type === "witch") {
    if (S.ui.witchAct === "save") {
      room.nightActions.witchSave = true;
      room.nightActions.witchSaveTarget = room.nightActions.wolfKill;
      room.nightActions.witchPoison = null;
    } else if (S.ui.witchAct === "poison") {
      if (!S.ui.pickSeat) { toast("請選擇目標玩家"); return; }
      room.nightActions.witchSave = false;
      room.nightActions.witchPoison = S.ui.pickSeat;
    } else {
      room.nightActions.witchSave = false;
      room.nightActions.witchPoison = null;
    }
  }
  S.ui.pickSeat = null; S.ui.seerResult = null; S.ui.witchAct = "";
  if (step.close) { S.ui.nightClosing = true; persistRoom(); renderAll(); return; }
  room.nightStepIndex++; persistRoom(); renderAll();
}

function applyDawn() {
  var room = S.room;
  var res = resolveNight({
    seats: room.seats,
    wolfKill: room.nightActions.wolfKill,
    guardTarget: room.nightActions.guardTarget,
    witchSave: !!room.nightActions.witchSave,
    witchSaveTarget: room.nightActions.witchSaveTarget,
    witchPoison: room.nightActions.witchPoison,
    witchPotions: { antidote: room.witchPotions.antidote, poison: room.witchPotions.poison },
    nightNumber: room.nightNumber,
    firstNightSelfSave: room.settings.firstNightSelfSave,
    lastGuardTarget: room.lastGuardTarget,
    witchSeat: findSeatByRole(room.seats, "witch")
  });
  room.witchPotions = res.witchPotions;
  if (room.nightActions.guardTarget) room.lastGuardTarget = room.nightActions.guardTarget;
  res.deaths.forEach(function (d) {
    var s = findSeat(room, d.seat);
    if (s) s.alive = false;
  });
  room.lastNightResult = res;
  room.phase = "dawn";
  room.pendingGuns = res.deaths.filter(function (d) {
    var s = findSeat(room, d.seat);
    if (!s) return false;
    return hunterShootStatus(s.roleId, d).canShoot;
  }).map(function (d) { return d.seat; });
  log(res.dawnSpeech);
  persistRoom(); renderAll();
}

function doGun(from, target) {
  var room = S.room;
  var shooter = findSeat(room, from);
  if (!shooter) return;
  if (target) {
    var t = findSeat(room, target);
    if (!t || !t.alive) { toast("請選擇存活玩家"); return; }
    t.alive = false;
    log(from + "號開槍帶走" + target + "號");
    if (t.isSheriff) queueBadge(t.no);
  } else {
    log(from + "號放棄開槍");
  }
  room.pendingGuns = (room.pendingGuns || []).filter(function (n) { return n !== from; });
  S.ui.gunTarget = null;
  var v = checkVictory(room.seats, room.settings.winCondition);
  persistRoom();
  if (v.over) return endGame(v);
  renderAll();
}

function enterDay() {
  var room = S.room;
  if (room.pendingGuns && room.pendingGuns.length) { toast("請先處理獵人／狼王開槍"); return; }
  var v = checkVictory(room.seats, room.settings.winCondition);
  if (v.over) return endGame(v);
  room.dayNumber = (room.dayNumber || 0) + 1;
  room.phase = "day";
  room.explodeCountToday = 0;
  S.ui.voteFor = {};
  S.ui.explodeSeat = null;
  S.ui.wwTarget = null;
  if (room.pendingBadgeFrom) room.daySub = "badge";
  else if (room.sheriff.enabled && !room.sheriff.done && room.dayNumber === 1) room.daySub = "sheriff-reg";
  else room.daySub = "talk";
  persistRoom(); renderAll();
}

function queueBadge(no) {
  var room = S.room;
  var s = findSeat(room, no);
  if (s) s.isSheriff = false;
  if (room.sheriff && room.sheriff.badgeSeat === no) room.sheriff.badgeSeat = null;
  room.pendingBadgeFrom = no;
}

function sherToggle(no) {
  var sh = S.room.sheriff;
  var s = findSeat(S.room, no);
  if (!s || !s.alive) return;
  var i = sh.candidates.indexOf(no);
  if (i >= 0) {
    sh.candidates.splice(i, 1);
    if (sh.withdrawn.indexOf(no) < 0) sh.withdrawn.push(no);
  } else {
    sh.candidates.push(no);
    sh.withdrawn = sh.withdrawn.filter(function (x) { return x !== no; });
  }
  persistRoom(); renderAll();
}
function sherSkip() {
  S.room.sheriff.done = true; S.room.sheriff.badgeSeat = null; S.room.daySub = "talk";
  log("本局跳過警上，無警長");
  persistRoom(); renderAll();
}
function sherToVote() {
  var sh = S.room.sheriff;
  var cands = sh.candidates.filter(function (n) { return sh.withdrawn.indexOf(n) < 0; });
  if (!cands.length) { toast("冇人上警，視為無警長"); return sherSkip(); }
  if (cands.length === 1) { electSheriff(cands[0]); return; }
  S.room.daySub = "sheriff-vote"; S.ui.voteFor = {}; persistRoom(); renderAll();
}
function electSheriff(no) {
  var sh = S.room.sheriff;
  sh.done = true; sh.badgeSeat = no;
  S.room.seats.forEach(function (s) { s.isSheriff = s.no === no; });
  sh.history.push({ type: "elect", seat: no, day: S.room.dayNumber });
  log(no + "號當選警長");
  S.room.daySub = "talk";
  persistRoom(); toast(no + "號當選警長"); renderAll();
}
function sherTally() {
  var sh = S.room.sheriff;
  var cands = (S.room.daySub === "sheriff-pk" ? (sh.pk || []) : sh.candidates.filter(function (n) { return sh.withdrawn.indexOf(n) < 0; }));
  var r = tallyVotes(S.ui.voteFor, cands);
  if (r.tie) {
    if (S.room.daySub === "sheriff-pk") {
      log("警上 PK 仍然平票，警徽流失");
      sh.done = true; sh.badgeSeat = null; S.room.daySub = "talk"; persistRoom(); toast("平票，無警長"); renderAll(); return;
    }
    sh.pk = r.tops; S.room.daySub = "sheriff-pk"; S.ui.voteFor = {}; persistRoom(); toast("平票，進入 PK"); renderAll(); return;
  }
  if (!r.winner) { toast("未有有效選票"); return; }
  electSheriff(r.winner);
}

function tallyExile() {
  var room = S.room;
  var cands = room.daySub === "pk" ? (room.pkCandidates || []) : room.seats.filter(function (s) { return s.alive; }).map(function (s) { return s.no; });
  var r = tallyVotes(S.ui.voteFor, cands);
  room.dayVotes.push({ day: room.dayNumber, type: room.daySub === "pk" ? "pk" : "exile", votes: JSON.parse(JSON.stringify(S.ui.voteFor)), result: r.winner, tie: r.tie });
  if (r.tie) {
    if (room.daySub === "pk") {
      log("第" + room.dayNumber + "天 PK 仍然平票，無人放逐");
      afterExile(null); return;
    }
    room.pkCandidates = r.tops; room.daySub = "pk"; S.ui.voteFor = {}; log("第" + room.dayNumber + "天放逐平票，進入 PK：" + r.tops.join("、") + "號"); persistRoom(); toast("平票 PK"); renderAll(); return;
  }
  if (!r.winner) { log("第" + room.dayNumber + "天無人被放逐"); afterExile(null); return; }
  afterExile(r.winner);
}

function afterExile(no) {
  var room = S.room;
  if (no) {
    var s = findSeat(room, no);
    if (s && s.roleId === "idiot" && !s.exiledAsIdiot) {
      s.exiledAsIdiot = true; s.lostVote = true; s.alive = true;
      log(no + "號白痴被放逐，翻牌免疫，失去投票權");
      if (s.isSheriff) { s.isSheriff = false; queueBadge(s.no); log("白痴警長，警徽須撕掉"); badgeTear(true); }
    } else if (s) {
      s.alive = false;
      log(no + "號被放逐出局");
      if (s.isSheriff) queueBadge(s.no);

function buildRecap(room) {
  if (!room) return "";
  var lines = [];
  lines.push("【HK狼人殺 復盤戰報】");
  lines.push("房號：" + room.code);
  lines.push("板子：" + (room.boardName || "") + " · " + room.playerCount + "人 · " + (room.settings.winCondition === "city" ? "屠城" : "屠邊"));
  lines.push("設定：首夜" + (room.settings.firstNightSelfSave ? "可自救" : "不可自救") + "；" + (room.settings.sheriffEnabled ? "有警上" : "無警上"));
  lines.push("");
  lines.push("【座位身份】");
  room.seats.forEach(function (s) {
    var r = findRole(s.roleId);
    lines.push(s.no + "號 " + (r ? r.name : "?") + (s.friendName ? "（" + s.friendName + "）" : "") + " · " + (s.alive ? "生存" : "出局") + (s.exiledAsIdiot ? " · 白痴翻牌" : "") + (s.isSheriff ? " · 警長" : ""));
  });
  lines.push("");
  lines.push("【過程紀錄】");
  (room.logs || []).forEach(function (l) { lines.push("· " + l.text); });
  if (room.sheriff && room.sheriff.history && room.sheriff.history.length) {
    lines.push(""); lines.push("【警徽流】");
    room.sheriff.history.forEach(function (h) {
      if (h.type === "elect") lines.push("第" + h.day + "天 " + h.seat + "號當選");
      if (h.type === "transfer") lines.push("第" + h.day + "天 " + h.from + "號 → " + h.to + "號");
      if (h.type === "tear") lines.push("第" + h.day + "天 撕警徽（原" + (h.from || "") + "號）");
      if (h.type === "swallow") lines.push("第" + h.day + "天 雙爆吞警徽");
    });
  }
  if (room.dayVotes && room.dayVotes.length) {
    lines.push(""); lines.push("【投票】");
    room.dayVotes.forEach(function (v) {
      var d = [];
      for (var k in v.votes) d.push(k + "→" + (v.votes[k] === "abstain" ? "棄" : v.votes[k] + "號"));
      lines.push("第" + v.day + "天" + (v.type === "pk" ? "PK" : "放逐") + "：" + d.join("，") + " ⇒ " + (v.result ? v.result + "號" : (v.tie ? "平票" : "無人")));
    });
  }
  lines.push("");
  lines.push("【勝負】" + (room.winnerText || "未結束"));
  return lines.join("\n");
}
function copyRecap() {

function compressAvatarFile(file, cb) {
  if (!file || !file.type || file.type.indexOf("image/") !== 0) { cb(""); return; }
  var url = (typeof URL !== "undefined" && URL.createObjectURL) ? URL.createObjectURL(file) : "";
  var img = new Image();
  img.onload = function () {
    try {
      var max = 320;
      var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      var scale = Math.min(1, max / Math.max(w, h, 1));
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(w * scale));
      c.height = Math.max(1, Math.round(h * scale));
      var ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, c.width, c.height);
      var out = "";
      try { out = c.toDataURL("image/webp", 0.82); } catch (e1) { out = ""; }
      if (!out || out.length > 180000) {
        try { out = c.toDataURL("image/jpeg", 0.84); } catch (e2) { out = ""; }
      }
      if (url && URL.revokeObjectURL) URL.revokeObjectURL(url);
      cb(out || "");
    } catch (err) {
      if (url && URL.revokeObjectURL) URL.revokeObjectURL(url);
      cb("");
    }
  };
  img.onerror = function () {
    if (url && URL.revokeObjectURL) URL.revokeObjectURL(url);
    cb("");
  };
  img.src = url;
}

var skylineCtl = { raf: 0, hiddenHandler: null, lights: [], flies: [], last: 0, cvs: null, ctx: null, w: 0, h: 0 };

function prefersReducedMotion() {
  try { return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }
  catch (e) { return false; }
}

function stopSkylineAnim() {
  if (skylineCtl.raf) { cancelAnimationFrame(skylineCtl.raf); skylineCtl.raf = 0; }
  if (skylineCtl.hiddenHandler) {
    document.removeEventListener("visibilitychange", skylineCtl.hiddenHandler);
    skylineCtl.hiddenHandler = null;
  }
  skylineCtl.cvs = null;
  skylineCtl.ctx = null;
}

function seedSkyline(w, h) {
  var lights = [], flies = [], i, r;
  /* city windows: mid-left band, then lower-left (avoid 開房 plate) */
  for (i = 0; i < 28; i++) {
    r = Math.random();
    lights.push({
      x: (0.13 + Math.random() * 0.35) * w,
      y: (0.585 + Math.random() * 0.145) * h,
      p: 0.6 + Math.random() * 2.4,
      o: Math.random() * Math.PI * 2,
      s: 0.7 + Math.random() * 1.4,
      c: r < 0.35 ? "255,210,120" : r < 0.6 ? "255,80,140" : r < 0.8 ? "120,230,255" : "210,170,255"
    });
  }
  for (i = 0; i < 14; i++) {
    r = Math.random();
    lights.push({
      x: (0.12 + Math.random() * 0.22) * w,
      y: (0.735 + Math.random() * 0.12) * h,
      p: 0.7 + Math.random() * 2.2,
      o: Math.random() * Math.PI * 2,
      s: 0.7 + Math.random() * 1.3,
      c: r < 0.4 ? "255,90,130" : r < 0.7 ? "255,220,130" : "140,220,255"
    });
  }
  for (i = 0; i < 5; i++) {
    flies.push({
      x: (0.10 + Math.random() * 0.32) * w,
      y: (0.48 + Math.random() * 0.28) * h,
      vx: (Math.random() * 0.12 + 0.03) * (Math.random() < 0.5 ? -1 : 1),
      vy: (Math.random() * 0.08 + 0.02) * (Math.random() < 0.5 ? -1 : 1),
      o: Math.random() * Math.PI * 2,
      p: 1.6 + Math.random() * 2.2
    });
  }
  return { lights: lights, flies: flies };
}

function syncSkylineAnim() {
  stopSkylineAnim();
  var wrap = document.querySelector(".sky-anim");
  var cvs = document.querySelector(".sky-canvas");
  if (!wrap || !cvs) return;
  if (prefersReducedMotion()) { wrap.style.display = "none"; return; }
  var home = document.querySelector(".home-exact");
  var w = (home && home.clientWidth) || cvs.clientWidth || 390;
  var h = (home && home.clientHeight) || cvs.clientHeight || 694;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = Math.max(1, Math.round(w * dpr));
  cvs.height = Math.max(1, Math.round(h * dpr));
  cvs.style.width = "100%";
  cvs.style.height = "100%";
  var ctx = cvs.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var seed = seedSkyline(w, h);
  skylineCtl.cvs = cvs;
  skylineCtl.ctx = ctx;
  skylineCtl.w = w;
  skylineCtl.h = h;
  skylineCtl.lights = seed.lights;
  skylineCtl.flies = seed.flies;
  skylineCtl.last = 0;

  function pauseCss(on) {
    if (on) wrap.classList.add("paused");
    else wrap.classList.remove("paused");
  }

  function tick(ts) {
    skylineCtl.raf = requestAnimationFrame(tick);
    if (document.hidden) { pauseCss(true); return; }
    pauseCss(false);
    var last = skylineCtl.last || ts;
    var dt = Math.min(48, ts - last) / 16.67;
    skylineCtl.last = ts;
    var t = ts / 1000;
    ctx.clearRect(0, 0, w, h);
    var i, L, a, fl;
    for (i = 0; i < skylineCtl.lights.length; i++) {
      L = skylineCtl.lights[i];
      a = 0.18 + 0.72 * (0.5 + 0.5 * Math.sin(t * L.p + L.o));
      ctx.beginPath();
      ctx.fillStyle = "rgba(" + L.c + "," + a.toFixed(3) + ")";
      ctx.arc(L.x, L.y, L.s, 0, Math.PI * 2);
      ctx.fill();
    }
    for (i = 0; i < skylineCtl.flies.length; i++) {
      fl = skylineCtl.flies[i];
      fl.x += fl.vx * dt;
      fl.y += fl.vy * dt;
      if (fl.x < w * 0.06 || fl.x > w * 0.48) fl.vx *= -1;
      if (fl.y < h * 0.42 || fl.y > h * 0.84) fl.vy *= -1;
      a = 0.15 + 0.7 * (0.5 + 0.5 * Math.sin(t * fl.p + fl.o));
      ctx.beginPath();
      ctx.fillStyle = "rgba(255,230,150," + a.toFixed(3) + ")";
      ctx.shadowColor = "rgba(255,220,140,0.8)";
      ctx.shadowBlur = 6;
      ctx.arc(fl.x, fl.y, 1.15, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  skylineCtl.hiddenHandler = function () {
    if (document.hidden) pauseCss(true);
    else { pauseCss(false); skylineCtl.last = 0; }
  };
  document.addEventListener("visibilitychange", skylineCtl.hiddenHandler);
  skylineCtl.raf = requestAnimationFrame(tick);
}

    if (sc === "open" || sc === "join" || sc === "board-list" || sc === "board-edit") S.screen = sc;
  } catch (e) {}
  renderAll();
})();

} // end document guard
